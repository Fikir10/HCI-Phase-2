<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Kitchen Kompanion</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="inventory.css"><link rel="stylesheet" href="additem.css">
<link rel="stylesheet" href="shopping.css"><link rel="stylesheet" href="meals.css">

<div id="frame">
